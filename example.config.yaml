# Subroutine Configuration
# Copy this file to config.yaml and customize for your environment
# Secrets (API keys, credentials) remain in .env files or environment variables

# Base URL (defaults to http://localhost)
# baseUrl: "https://your-production-domain.com"

# AI Model Definitions
# Define your available models with their provider and authentication details
models:
  # Anthropic Claude via direct API
  claude-sonnet-4.5:
    provider: anthropic
    model: claude-sonnet-4-5-20250929
    apiKey: $ANTHROPIC_API_KEY # Environment variable interpolation
    # endpoint: "https://api.anthropic.com"  # Optional custom endpoint

  # Anthropic Claude via Google Vertex AI
  vertex-claude-sonnet:
    provider: vertex-anthropic
    model: claude-sonnet-4-5-20250929
    # Uses GOOGLE_VERTEX_PROJECT, GOOGLE_VERTEX_LOCATION env vars

  # OpenAI GPT-4
  gpt-4o:
    provider: openai
    model: gpt-4o
    apiKey: $OPENAI_API_KEY
    # endpoint: "https://api.openai.com/v1"  # Optional custom endpoint

  # Google Gemini 2.5 Flash via Vertex AI
  gemini-2.5-flash:
    provider: vertex-gemini
    model: gemini-2.5-flash
    # Uses GOOGLE_VERTEX_PROJECT, GOOGLE_VERTEX_LOCATION env vars

  # Google Gemini 3.0 Pro via Vertex AI (example for newer model)
  gemini-3.0-pro:
    provider: vertex-gemini
    model: gemini-3-pro-preview
    # Uses GOOGLE_VERTEX_PROJECT, GOOGLE_VERTEX_LOCATION env vars

# Capability-to-Model Mappings
# Map capabilities to models (supports fallback with arrays)
# Nested capabilities support fallback (e.g., coding.syntax_fix falls back to coding)
capabilities:
  # General purpose tasks
  general: claude-sonnet-4.5

  # Code generation and analysis
  coding:
    - claude-sonnet-4.5 # Primary
    - gemini-2.5-flash # Fallback

  # Nested capability example: specific retry logic for syntax errors
  # Falls back to 'coding' if not explicitly mapped
  coding.syntax_fix: gemini-3.0-pro

  # Web search functionality
  web_search: gemini-2.5-flash

  # Planning and design tasks
  planning: claude-sonnet-4.5

# Authentication Configuration
auth:
  # Base URL override (optional - inherits from top-level baseUrl if not set)
  # Only needed for separate auth domain (e.g., auth.yourdomain.com)
  # baseUrl: "https://auth.your-domain.com"

  providers:
    github:
      enabled: false
      # Get your OAuth App credentials from: https://github.com/settings/developers
      # Add Client ID here, Client Secret goes in .env as GITHUB_CLIENT_SECRET
      # clientId: "Ov23lixxxxxxxxxx"

    google:
      enabled: false
      # Get your OAuth credentials from: https://console.cloud.google.com/apis/credentials
      # Add Client ID here, Client Secret goes in .env as GOOGLE_CLIENT_SECRET
      # clientId: "123456789-xxxxxxxx.apps.googleusercontent.com"

    # Email/Password authentication
    emailPassword:
      enabled: true

# Rate Limiting Configuration (optional)
# rateLimit:
