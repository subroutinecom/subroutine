name: release-images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag (defaults to commit SHA)
        required: false
        default: ""

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_TAG: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: admin-panel
            dockerfile: ./admin-panel/Dockerfile
          - service: api
            dockerfile: ./api/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}:${{ env.IMAGE_TAG }}
          build-args: |
            CI=true
            BUILD_SHA=${{ github.sha }}
