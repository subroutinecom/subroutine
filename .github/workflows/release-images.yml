name: release-images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag (defaults to commit SHA)
        required: false
        default: ""

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_TAG: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.sha }}
      GHCR_IMAGE_PREFIX: ghcr.io/${{ github.repository }}
      BUILD_SHA: ${{ github.sha }}
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release images via docker compose
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml build admin-panel api sandbox

      - name: Push release images via docker compose
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml push admin-panel api sandbox
