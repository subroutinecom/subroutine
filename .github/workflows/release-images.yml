name: Build release images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag (defaults to commit SHA)
        required: false
        default: ""
      admin_panel:
        description: Build admin-panel image
        required: false
        type: boolean
        default: true
      api:
        description: Build api image
        required: false
        type: boolean
        default: true
      sandbox:
        description: Build sandbox image
        required: false
        type: boolean
        default: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_TAG: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.sha }}
      GHCR_IMAGE_PREFIX: ghcr.io/${{ github.repository }}
      BUILD_SHA: ${{ github.sha }}
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive short SHA
        run: echo "SHORT_IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select services
        id: select-services
        run: |
          services=()
          if [[ "${{ github.event.inputs.admin_panel }}" == 'true' ]]; then
            services+=("admin-panel")
          fi
          if [[ "${{ github.event.inputs.api }}" == 'true' ]]; then
            services+=("api")
          fi
          if [[ "${{ github.event.inputs.sandbox }}" == 'true' ]]; then
            services+=("sandbox")
          fi

          if [[ ${#services[@]} -eq 0 ]]; then
            echo "No services selected to build."
            exit 1
          fi

          services_newline="$(printf "%s\n" "${services[@]}")"
          services_csv="$(IFS=,; echo "${services[*]}")"

          {
            echo "SERVICES<<EOF"
            printf "%s\n" "${services_newline}"
            echo "EOF"
          } >> "$GITHUB_ENV"

          echo "targets=${services_csv}" >> "$GITHUB_OUTPUT"
          echo "Selected services: ${services[*]}"

      - name: Build and push release images (with cache)
        uses: docker/bake-action@v5
        with:
          files: |
            docker-compose.yml
            docker-compose.prod.yml
          targets: ${{ steps.select-services.outputs.targets }}
          set: |
            *.cache-from=type=gha,scope=subroutine
            *.cache-to=type=gha,scope=subroutine,mode=max
          push: true

      - name: Tag images with short SHA
        run: |
          for image in $SERVICES; do
            docker buildx imagetools create --tag "${GHCR_IMAGE_PREFIX}-${image}:${SHORT_IMAGE_TAG}" "${GHCR_IMAGE_PREFIX}-${image}:${IMAGE_TAG}"
          done

      - name: Tag images as latest
        run: |
          for image in $SERVICES; do
            docker buildx imagetools create --tag "${GHCR_IMAGE_PREFIX}-${image}:latest" "${GHCR_IMAGE_PREFIX}-${image}:${IMAGE_TAG}"
          done
