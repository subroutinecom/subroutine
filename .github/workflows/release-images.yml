name: Build release images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag (defaults to commit SHA)
        required: false
        default: ""
      admin_panel:
        description: Build admin-panel image
        required: false
        type: boolean
        default: true
      api:
        description: Build api image
        required: false
        type: boolean
        default: true
      sandbox:
        description: Build sandbox image
        required: false
        type: boolean
        default: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_TAG: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.sha }}
      GHCR_IMAGE_PREFIX: ghcr.io/${{ github.repository }}
      BUILD_SHA: ${{ github.sha }}
      SHORT_IMAGE_TAG: ${{ github.sha.substr(0, 7) }}
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select services
        run: |
          services=()
          if [[ "${{ github.event.inputs.admin_panel }}" == 'true' ]]; then
            services+=("admin-panel")
          fi
          if [[ "${{ github.event.inputs.api }}" == 'true' ]]; then
            services+=("api")
          fi
          if [[ "${{ github.event.inputs.sandbox }}" == 'true' ]]; then
            services+=("sandbox")
          fi

          if [[ ${#services[@]} -eq 0 ]]; then
            echo "No services selected to build."
            exit 1
          fi

          echo "SERVICES=${services[*]}" >> "$GITHUB_ENV"
          echo "Selected services: ${services[*]}"

      - name: Build release images via docker compose
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml build $SERVICES

      - name: Push release images via docker compose
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml push $SERVICES

      - name: Tag images with short SHA
        run: |
          for image in $SERVICES; do
            docker tag "${GHCR_IMAGE_PREFIX}-${image}:${IMAGE_TAG}" "${GHCR_IMAGE_PREFIX}-${image}:${SHORT_IMAGE_TAG}"
          done

      - name: Push short SHA tags
        run: |
          for image in $SERVICES; do
            docker push "${GHCR_IMAGE_PREFIX}-${image}:${SHORT_IMAGE_TAG}"
          done

      - name: Tag images as latest
        run: |
          for image in $SERVICES; do
            docker tag "${GHCR_IMAGE_PREFIX}-${image}:${IMAGE_TAG}" "${GHCR_IMAGE_PREFIX}-${image}:latest"
          done

      - name: Push latest tags
        run: |
          for image in $SERVICES; do
            docker push "${GHCR_IMAGE_PREFIX}-${image}:latest"
          done
