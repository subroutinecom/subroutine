services:
  sandbox:
    build:
      context: .
      dockerfile: ./sandbox/Dockerfile
    ports:
      - "3000:3000"
    expose:
      - 3000
    volumes:
      - ./sandbox:/app/sandbox
      - ./eslint:/app/eslint
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/_status"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    ports:
      - "3003:3003"
    expose:
      - 3003
    volumes:
      - api-node-modules:/app/api/node_modules
      - ./api:/app/api
      - ./eslint:/app/eslint
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/status"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      sandbox:
        condition: service_healthy

  subroutine-server:
    build:
      context: .
      dockerfile: ./subroutine-server/Dockerfile
    ports:
      - "3002:3002"
    expose:
      - 3002
    volumes:
      - subroutine-server-node-modules:/app/subroutine-server/node_modules
      - subroutine-server-react-router:/app/subroutine-server/.react-router

      - ./subroutine-server:/app/subroutine-server
      - ./eslint:/app/eslint
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  tests:
    build:
      context: .
      dockerfile: ./tests/Dockerfile
    volumes:
      - ./tests:/app/tests
    depends_on:
      sandbox:
        condition: service_healthy
      api:
        condition: service_healthy
      subroutine-server:
        condition: service_healthy

volumes:
  api-node-modules:
    driver: local
  subroutine-server-node-modules:
    driver: local
  subroutine-server-react-router:
    driver: local
