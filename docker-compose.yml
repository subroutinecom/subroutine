services:
  sandbox:
    build:
      context: .
      dockerfile: ./sandbox/Dockerfile
    ports:
      - "3000:3000"
    expose:
      - 3000
    volumes:
      - ./sandbox:/app/sandbox
      - ./eslint:/app/eslint
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/_status"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  tests:
    build:
      context: .
      dockerfile: ./tests/Dockerfile
    depends_on:
      sandbox:
        condition: service_healthy
