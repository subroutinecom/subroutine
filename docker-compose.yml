services:
  postgres:
    hostname: postgres.subroutine.internal
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: subroutine
      POSTGRES_PASSWORD: subroutine
      POSTGRES_DB: subroutine
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subroutine"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    hostname: redis.subroutine.internal
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  sandbox:
    hostname: sandbox.subroutine.internal
    build:
      context: .
      dockerfile: ./sandbox/Dockerfile
      target: dev
    ports:
      - "3000:80"
    volumes:
      - ./sandbox:/app/sandbox
      - ./eslint:/app/eslint
      - ./packages:/app/packages
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/_status"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  api:
    hostname: api.subroutine.internal
    build:
      context: .
      dockerfile: ./api/Dockerfile
      target: dev
    ports:
      - "3002:80"
    environment:
      DATABASE_URL: postgresql://subroutine:subroutine@postgres:5432/subroutine
      ENABLE_MOCK_OAUTH: "true"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - api-node-modules:/app/api/node_modules
      - ./api:/app/api
      - ./eslint:/app/eslint
      - ./packages:/app/packages
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox:
        condition: service_healthy

  admin-panel:
    hostname: admin-panel.subroutine.internal
    build:
      context: .
      dockerfile: ./admin-panel/Dockerfile
      target: dev
    environment:
      VITE_API_URL: http://localhost:3002
    ports:
      - "3001:80"
    volumes:
      - admin-panel-node-modules:/app/admin-panel/node_modules
      - admin-panel-react-router:/app/admin-panel/.react-router
      - admin-panel-vite:/app/admin-panel/.vite

      - ./admin-panel:/app/admin-panel
      - ./eslint:/app/eslint
      - ./config.yaml:/app/config.yaml:ro
      - ./packages:/app/packages
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  tests:
    hostname: tests.subroutine.internal
    build:
      context: .
      dockerfile: ./tests/Dockerfile
      target: dev
    environment:
      TEST_NAMES: ${TEST_NAMES:-}
    volumes:
      - ./tests:/app/tests
      - ./packages:/app/packages
      - ./api:/app/api
      - ./sandbox:/app/sandbox
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3456/health"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      sandbox:
        condition: service_healthy
      api:
        condition: service_healthy
      admin-panel:
        condition: service_healthy

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  api-node-modules:
    driver: local
  admin-panel-node-modules:
    driver: local
  admin-panel-react-router:
    driver: local
  admin-panel-vite:
    driver: local
