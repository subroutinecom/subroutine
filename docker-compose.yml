services:
  sandbox:
    build:
      context: .
      dockerfile: ./sandbox/Dockerfile
    ports:
      - "3000:3000"
    expose:
      - 3000
    volumes:
      - ./sandbox:/app/sandbox
      - ./eslint:/app/eslint
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/_status"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    ports:
      - "3003:3003"
    expose:
      - 3003
    volumes:
      - api-node-modules:/app/api/node_modules
      - ./api:/app/api
      - ./eslint:/app/eslint
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/status"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      sandbox:
        condition: service_healthy

  admin-panel:
    build:
      context: .
      dockerfile: ./admin-panel/Dockerfile
    ports:
      - "3002:3002"
    expose:
      - 3002
    volumes:
      - admin-panel-node-modules:/app/admin-panel/node_modules
      - admin-panel-react-router:/app/admin-panel/.react-router
      - admin-panel-vite:/app/admin-panel/.vite

      - ./admin-panel:/app/admin-panel
      - ./eslint:/app/eslint
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  tests:
    build:
      context: .
      dockerfile: ./tests/Dockerfile
    volumes:
      - ./tests:/app/tests
    depends_on:
      sandbox:
        condition: service_healthy
      api:
        condition: service_healthy
      admin-panel:
        condition: service_healthy

volumes:
  api-node-modules:
    driver: local
  admin-panel-node-modules:
    driver: local
  admin-panel-react-router:
    driver: local
  admin-panel-vite:
    driver: local
