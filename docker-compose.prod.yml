x-release-build: &release-build
  build:
    args:
      CI: true
      BUILD_SHA: ${BUILD_SHA:-}
      VITE_API_URL: ${VITE_API_URL:-https://api.subroutine.com}
    target: prod

services:
  admin-panel:
    hostname: admin-panel.subroutine.internal
    <<: *release-build
    volumes: !reset []
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/local/subroutine}-admin-panel:${IMAGE_TAG:-dev}

  api:
    hostname: api.subroutine.internal
    volumes: !reset []
    <<: *release-build
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/local/subroutine}-api:${IMAGE_TAG:-dev}

  sandbox:
    hostname: sandbox.subroutine.internal
    volumes: !reset []
    <<: *release-build
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/local/subroutine}-sandbox:${IMAGE_TAG:-dev}
