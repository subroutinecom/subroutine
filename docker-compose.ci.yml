x-common-args: &common-args
  CI: true
  BUILD_SHA: ${BUILD_SHA:-}

services:
  sandbox:
    hostname: sandbox.subroutine.internal
    volumes: !reset []
    build:
      target: prod
      args:
        <<: *common-args
  api:
    hostname: api.subroutine.internal
    volumes: !override
      - ./example.config.yaml:/app/config.yaml:ro
    environment:
      ENCRYPTION_KEY: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
    build:
      target: prod
      args:
        <<: *common-args

  admin-panel:
    hostname: admin-panel.subroutine.internal
    volumes: !override
      - ./example.config.yaml:/app/config.yaml:ro
    build:
      target: prod
      args:
        <<: *common-args

  tests:
    hostname: tests.subroutine.internal
    build:
      target: ci
