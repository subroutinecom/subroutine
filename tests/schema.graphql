type ApiKey {
  createdAt: String
  enabled: Boolean
  expiresAt: String
  id: String
  metadata: String
  name: String
  organizationId: String
  permissions: String
  prefix: String
  start: String
  updatedAt: String
}

type CreatedApiKey {
  createdAt: String
  enabled: Boolean
  expiresAt: String
  id: String
  key: String
  metadata: String
  name: String
  organizationId: String
  permissions: String
  prefix: String
  start: String
  updatedAt: String
}

type Integration {
  id: String!
  organizationId: String!
  provider: String!
  name: String!
  authConfig: String!
  enabled: Boolean!
  createdAt: String!
  updatedAt: String!
}

type ConnectedAccount {
  id: String!
  integrationId: String!
  userId: String!
  organizationId: String!
  credentials: String!
  accountIdentifier: String
  status: String!
  lastUsedAt: String
  createdAt: String!
  updatedAt: String!
}

type Mutation {
  createApiKey(
    """JSON string of metadata"""
    metadata: String
    name: String
    prefix: String
  ): CreatedApiKey
  deleteApiKey(id: String!): Boolean
  updateApiKey(
    id: String!

    """JSON string of metadata"""
    metadata: String
    name: String
  ): ApiKey
  createIntegration(
    provider: String!
    name: String!
    """JSON string of IntegrationAuthConfig"""
    authConfig: String!
  ): Integration
  updateIntegration(
    id: String!
    name: String
    """JSON string of IntegrationAuthConfig"""
    authConfig: String
    enabled: Boolean
  ): Integration
  deleteIntegration(id: String!): Boolean
  createConnectedAccount(
    integrationId: String!
    """JSON string of ConnectedAccountCredentials"""
    credentials: String!
    accountIdentifier: String
  ): ConnectedAccount
  deleteConnectedAccount(id: String!): Boolean
}

type Query {
  apiKey(id: String!): ApiKey
  apiKeys: [ApiKey!]
  ping: String
  integrations: [Integration!]
  integration(id: String!): Integration
  connectedAccounts: [ConnectedAccount!]
  connectedAccount(id: String!): ConnectedAccount
  connectedAccountsByIntegration(integrationId: String!): [ConnectedAccount!]
}
