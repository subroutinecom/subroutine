schema {
  query: Query
  mutation: Mutation
}

type ApiKey {
  createdAt: String
  enabled: Boolean
  expiresAt: String
  id: String
  metadata: String
  name: String
  organizationId: String
  permissions: String
  prefix: String
  start: String
  updatedAt: String
}

type ConnectedAccount {
  accountIdentifier: String
  createdAt: String
  credentials: String
  id: String
  integrationId: String
  lastUsedAt: String
  organizationId: String
  status: String
  updatedAt: String
  viewerId: String
}

type CreatedApiKey {
  createdAt: String
  enabled: Boolean
  expiresAt: String
  id: String
  key: String
  metadata: String
  name: String
  organizationId: String
  permissions: String
  prefix: String
  start: String
  updatedAt: String
}

type Integration {
  authConfig: String
  createdAt: String
  description: String
  enabled: Boolean
  id: String
  name: String
  organizationId: String
  provider: String
  updatedAt: String
  visibility: String
}

type IntegrationProviderDefinition {
  authType: String
  description: String
  id: String
  mcpConfig: IntegrationProviderMcpConfig
  name: String
  oauthConfig: IntegrationProviderOAuthConfig
  viewerScoped: Boolean
}

type IntegrationProviderMcpConfig {
  authStrategy: McpAuthStrategy
  serverUrl: String
  transport: String
}

type IntegrationProviderOAuthConfig {
  authUrl: String
  defaultRedirectPath: String
  defaultScopes: [String!]
  requiredScopes: [String!]
  tokenUrl: String
}

type McpAuthStrategy {
  headerName: String
  headers: String
  type: String
}

type McpOAuthDiscoveryResult {
  authorizationEndpoint: String
  authorizationServer: String
  dynamicRegistrationSupported: Boolean
  error: String
  pkceSupported: Boolean
  registrationEndpoint: String
  scopesSupported: [String!]
  serverName: String
  success: Boolean
  tokenEndpoint: String
}

type Mutation {
  createApiKey(
    """JSON string of metadata"""
    metadata: String
    name: String
    prefix: String
  ): CreatedApiKey
  createConnectedAccount(
    accountIdentifier: String
    """JSON string of ConnectedAccountCredentials"""
    credentials: String!
    integrationId: String!
    viewerId: String!
  ): ConnectedAccount
  createIntegration(
    """JSON string of IntegrationAuthConfig"""
    authConfig: String!
    description: String
    name: String!
    provider: String!
    """
    Integration visibility: 'private' (default) or 'global' (superadmin only)
    """
    visibility: String
  ): Integration
  deleteApiKey(id: String!): Boolean
  deleteConnectedAccount(id: String!): Boolean
  deleteIntegration(id: String!): Boolean
  """Set integration visibility (superadmin only for 'global')"""
  setIntegrationVisibility(
    id: String!
    """'private' or 'global'"""
    visibility: String!
  ): Integration
  updateApiKey(
    id: String!
    """JSON string of metadata"""
    metadata: String
    name: String
  ): ApiKey
  updateIntegration(
    """JSON string of IntegrationAuthConfig"""
    authConfig: String
    enabled: Boolean
    id: String!
    name: String
  ): Integration
  """Update integration description"""
  updateIntegrationDescription(description: String, id: String!): Integration
}

type Query {
  apiKey(id: String!): ApiKey
  apiKeys: [ApiKey!]
  connectedAccount(id: String!): ConnectedAccount
  connectedAccounts: [ConnectedAccount!]
  connectedAccountsByIntegration(integrationId: String!): [ConnectedAccount!]
  discoverMcpOAuth(serverUrl: String!): McpOAuthDiscoveryResult
  integration(id: String!): Integration
  integrationProviders: [IntegrationProviderDefinition!]
  """
  Get integrations with optional visibility filter. Filter: 'private' (org-specific only), 'global' (registry only), 'all' or omit for both.
  """
  integrations(
    """Filter by visibility: 'private', 'global', or 'all' (default)"""
    visibility: String
  ): [Integration!]
  """Check if the current organization has superadmin privileges"""
  isSuperadmin: Boolean
  ping: String
  """Validate an organization slug for format and availability"""
  validateSlug(slug: String!): SlugValidationResult
}

type SlugValidationResult {
  available: Boolean
  error: String
  valid: Boolean
}