schema {
  query: Query
  mutation: Mutation
}

type ApiKey {
  createdAt: String
  enabled: Boolean
  expiresAt: String
  id: String
  metadata: String
  name: String
  organizationId: String
  permissions: String
  prefix: String
  start: String
  updatedAt: String
}

type CreatedApiKey {
  createdAt: String
  enabled: Boolean
  expiresAt: String
  id: String
  key: String
  metadata: String
  name: String
  organizationId: String
  permissions: String
  prefix: String
  start: String
  updatedAt: String
}

type Integration {
  authConfig: String
  createdAt: String
  description: String
  enabled: Boolean
  id: String
  name: String
  organizationId: String
  provider: String
  updatedAt: String
  visibility: String
}

type IntegrationAuthOption {
  apiKeyConfig: IntegrationAuthOptionApiKeyConfig
  description: String
  id: String
  label: String
  oauthConfig: IntegrationProviderOAuthConfig
  recommended: Boolean
  strategy: McpAuthStrategy
  viewerScoped: Boolean
}

type IntegrationAuthOptionApiKeyConfig {
  headerName: String
  headerPrefix: String
  instructionsUrl: String
}

type IntegrationProviderDefinition {
  authType: String
  category: String
  description: String
  graphqlConfig: IntegrationProviderGraphQLConfig
  id: String
  mcpConfig: IntegrationProviderMcpConfig
  name: String
  oauthConfig: IntegrationProviderOAuthConfig
  openapiConfig: IntegrationProviderOpenAPIConfig
  viewerScoped: Boolean
}

type IntegrationProviderGraphQLConfig {
  authOptions: [IntegrationAuthOption!]
  endpoint: String
}

type IntegrationProviderMcpConfig {
  authOptions: [IntegrationAuthOption!]
  serverUrl: String
  transport: String
}

type IntegrationProviderOAuthConfig {
  authUrl: String
  defaultRedirectPath: String
  defaultScopes: [String!]
  requiredScopes: [String!]
  tokenUrl: String
}

type IntegrationProviderOpenAPIConfig {
  authOptions: [IntegrationAuthOption!]
  baseUrl: String
  specUrl: String
}

type IntegrationSchemaResult {
  code: String
  error: String
  fetchedAt: Int
  schema: String
  success: Boolean
}

type IntegrationTestCase {
  description: String
  id: String
  name: String
  providerId: String
  readonly: Boolean
}

type McpAuthStrategy {
  headerName: String
  headers: String
  type: String
}

type McpOAuthDiscoveryResult {
  authorizationEndpoint: String
  authorizationServer: String
  dynamicRegistrationSupported: Boolean
  error: String
  pkceSupported: Boolean
  registrationEndpoint: String
  scopesSupported: [String!]
  serverName: String
  success: Boolean
  tokenEndpoint: String
}

type Mutation {
  createApiKey(
    """JSON string of metadata"""
    metadata: String
    name: String
    prefix: String
  ): CreatedApiKey
  createIntegration(
    """JSON string of IntegrationAuthConfig"""
    authConfig: String!
    description: String
    name: String!
    provider: String!
    """
    Integration visibility: 'private' (default) or 'global' (superadmin only)
    """
    visibility: String
  ): Integration
  deleteApiKey(id: String!): Boolean
  deleteIntegration(id: String!): Boolean
  """
  Fetch an OpenAPI spec and store it for an integration. Only works for OpenAPI integrations with specUrl configured.
  """
  introspectIntegrationOpenAPISpec(integrationId: String!): OpenAPIIntrospectionResult
  """
  Introspect a GraphQL endpoint and store the schema. Only works for GraphQL integrations with appropriate auth configured.
  """
  introspectIntegrationSchema(integrationId: String!): IntegrationSchemaResult
  """
  Run integration tests for a specific integration. Requires a connected account with valid OAuth tokens.
  """
  runIntegrationTests(
    integrationId: String!
    """
    Specific test case IDs to run. If omitted, runs all tests for the provider.
    """
    testCaseIds: [String!]
  ): TestRunResult
  """Set integration visibility (superadmin only for 'global')"""
  setIntegrationVisibility(
    id: String!
    """'private' or 'global'"""
    visibility: String!
  ): Integration
  updateApiKey(
    id: String!
    """JSON string of metadata"""
    metadata: String
    name: String
  ): ApiKey
  updateIntegration(
    """JSON string of IntegrationAuthConfig"""
    authConfig: String
    enabled: Boolean
    id: String!
    name: String
  ): Integration
  """Update integration description"""
  updateIntegrationDescription(description: String, id: String!): Integration
}

type OpenAPIIntrospectionResult {
  code: String
  error: String
  fetchedAt: Int
  operations: [OpenAPIOperation!]
  spec: String
  success: Boolean
  version: String
}

type OpenAPIOperation {
  method: String
  path: String
  summary: String
}

type Query {
  apiKey(id: String!): ApiKey
  apiKeys: [ApiKey!]
  discoverMcpOAuth(serverUrl: String!): McpOAuthDiscoveryResult
  integration(id: String!): Integration
  """Get the stored OpenAPI spec for an OpenAPI integration"""
  integrationOpenAPISpec(integrationId: String!): StoredOpenAPISpec
  integrationProviders: [IntegrationProviderDefinition!]
  """Get the stored GraphQL schema for a GraphQL integration"""
  integrationSchema(integrationId: String!): StoredSchema
  """Get available test cases for a provider"""
  integrationTestCases(providerId: String!): [IntegrationTestCase!]
  """
  Get integrations with optional visibility filter. Filter: 'private' (org-specific only), 'global' (registry only), 'all' or omit for both.
  """
  integrations(
    """Filter by visibility: 'private', 'global', or 'all' (default)"""
    visibility: String
  ): [Integration!]
  """
  Introspect a GraphQL endpoint to verify connectivity and fetch schema. Used during integration creation to validate the endpoint.
  """
  introspectGraphQLEndpoint(
    endpoint: String!
    """JSON string of headers to include in the request"""
    headers: String
  ): IntegrationSchemaResult
  """
  Introspect an OpenAPI endpoint to verify connectivity and fetch spec. Used during integration creation to validate the endpoint.
  """
  introspectOpenAPIEndpoint(
    """JSON string of headers to include in the request"""
    headers: String
    specUrl: String!
  ): OpenAPIIntrospectionResult
  """Check if the current organization has superadmin privileges"""
  isSuperadmin: Boolean
  ping: String
  """Validate an organization slug for format and availability"""
  validateSlug(slug: String!): SlugValidationResult
}

type SlugValidationResult {
  available: Boolean
  error: String
  valid: Boolean
}

type StoredOpenAPISpec {
  fetchedAt: Int
  operations: [OpenAPIOperation!]
  spec: String
  version: String
}

type StoredSchema {
  fetchedAt: Int
  schema: String
}

type TestAuthRequirement {
  authInstructions: String
  authorizationUrl: String
  integrationId: String
  integrationName: String
  patLinkUrl: String
  provider: String
  state: String
}

type TestCaseError {
  message: String
  name: String
  stack: String
}

type TestCaseResult {
  details: String
  durationMs: Int
  error: TestCaseError
  message: String
  success: Boolean
  testCaseId: String
}

type TestRunResult {
  authRequired: Boolean
  """
  Full auth requirement details including OAuth URL, PAT link URL, and instructions.
  """
  authRequirement: TestAuthRequirement
  """OAuth authorization URL. Deprecated: use authRequirement instead."""
  authorizationUrl: String
  executedAt: String
  integrationId: String
  providerId: String
  results: [TestCaseResult!]
  summary: TestRunSummary
}

type TestRunSummary {
  failed: Int
  passed: Int
  total: Int
  totalDurationMs: Int
}