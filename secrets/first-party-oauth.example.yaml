# First-Party OAuth Credentials
# ==============================
# This file contains Subroutine-branded OAuth app credentials.
# Copy this to `first-party-oauth.yaml` and fill in your credentials.
#
# These credentials are used when users enable a first-party integration
# without providing their own OAuth app credentials.

# Each provider ID maps to OAuth credentials
# The provider ID must match the provider definition ID in code

linear:
  clientId: "YOUR_LINEAR_CLIENT_ID"
  clientSecret: "YOUR_LINEAR_CLIENT_SECRET"

slack:
  clientId: "YOUR_SLACK_CLIENT_ID"
  clientSecret: "YOUR_SLACK_CLIENT_SECRET"

github:
  clientId: "YOUR_GITHUB_CLIENT_ID"
  clientSecret: "YOUR_GITHUB_CLIENT_SECRET"

discord:
  clientId: "YOUR_DISCORD_CLIENT_ID"
  clientSecret: "YOUR_DISCORD_CLIENT_SECRET"

jira:
  clientId: "YOUR_ATLASSIAN_CLIENT_ID"
  clientSecret: "YOUR_ATLASSIAN_CLIENT_SECRET"

asana:
  clientId: "YOUR_ASANA_CLIENT_ID"
  clientSecret: "YOUR_ASANA_CLIENT_SECRET"

sentry:
  clientId: "YOUR_SENTRY_CLIENT_ID"
  clientSecret: "YOUR_SENTRY_CLIENT_SECRET"

notion:
  clientId: "YOUR_NOTION_CLIENT_ID"
  clientSecret: "YOUR_NOTION_CLIENT_SECRET"
